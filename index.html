<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Homeless Rock Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e0ef;--fg:#1b1326;--btn:rgba(30,10,50,.10);--btnb:rgba(30,10,50,.38);--accent:#c2262e;--gold:#d08a10;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0712;--fg:#f1e8ff;--btn:rgba(255,255,255,.10);--btnb:rgba(255,255,255,.38);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0712;--fg:#f1e8ff;--btn:rgba(255,255,255,.10);--btnb:rgba(255,255,255,.38);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;max-width:100%}
#ctrl{width:100%;max-width:640px;height:180px;display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
body.land #ctrl{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);max-width:none;height:150px;padding:8px calc(18px + env(safe-area-inset-left,0px));pointer-events:none;opacity:.72}
body.land #ctrl>*{pointer-events:auto}
body.desk #ctrl{display:none}
#dpad{width:140px;height:140px;border-radius:50%;background:var(--btn);border:2px solid var(--btnb);position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--btnb)}
#btns{display:grid;grid-template-columns:repeat(2,66px);grid-template-rows:repeat(2,66px);gap:10px}
#btns button{font:inherit;font-size:8px;color:var(--fg);background:var(--btn);border:2px solid var(--btnb);border-radius:50%;touch-action:none;padding:0}
#btns button.on{background:var(--btnb)}
#btns button[data-b=special]{border-color:var(--gold)}
#btns button[data-b=punch]{border-color:var(--accent)}
#keys{display:none;font-size:8px;line-height:1.8;margin-top:10px;opacity:.75;text-align:center;padding:0 10px}
body.desk #keys{display:block}
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<div id="keys">Move: arrows / WASD &nbsp; Punch: J &nbsp; Kick: K &nbsp; Jump: Space &nbsp; Rock: L &nbsp; Start: Enter</div>
<div id="ctrl">
  <div id="dpad"><div id="knob"></div></div>
  <div id="btns">
    <button data-b="special">ROCK</button>
    <button data-b="jump">JUMP</button>
    <button data-b="kick">KICK</button>
    <button data-b="punch">PUNCH</button>
  </div>
</div>
<script>

(()=>{
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const W=480,H=270;ctx.imageSmoothingEnabled=false;
const GY0=162,GY1=254;
const F="'Press Start 2P',monospace";
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=n=>Math.random()*n|0;
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w,h)};

/* ---------- layout ---------- */
function layout(){const vw=innerWidth,vh=innerHeight,touch=matchMedia('(pointer:coarse)').matches,land=vw>vh;
 document.body.classList.toggle('desk',!touch);document.body.classList.toggle('land',touch&&land);
 const reserve=!touch?44:land?6:196;let cw=vw,ch=cw*9/16;if(ch>vh-reserve){ch=vh-reserve;cw=ch*16/9}
 cv.style.width=Math.floor(cw)+'px';cv.style.height=Math.floor(ch)+'px'}
addEventListener('resize',layout);layout();

/* ---------- audio ---------- */
let ac=null;
function initAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(ac.state==='suspended')ac.resume()}
function tone(f,d,type,vol=.07,end=.5){if(!ac)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*end),n+d);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}
function sfx(t){switch(t){
 case 'hit':tone(170,.08,'square');break;case 'hurt':tone(95,.18,'sawtooth',.08);break;
 case 'jump':tone(380,.12,'square',.05,1.6);break;case 'hiss':tone(1200,.12,'triangle',.04,.6);break;
 case 'pick':tone(520,.1,'square',.06,2);setTimeout(()=>tone(780,.12,'square',.06,1.5),90);break;
 case 'kill':tone(240,.2,'square',.07,.3);break;
 case 'rock':[82,110,165].forEach(f=>tone(f,.9,'sawtooth',.06,.98));break;}}

/* ---------- input ---------- */
const keys={left:false,right:false,up:false,down:false},press={};
const tap=b=>{press[b]=true;initAudio()};
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
const KB={KeyJ:'punch',KeyZ:'punch',KeyK:'kick',KeyX:'kick',Space:'jump',KeyC:'jump',KeyL:'special',KeyV:'special',Enter:'start'};
addEventListener('keydown',e=>{if(KM[e.code]){keys[KM[e.code]]=true;e.preventDefault()}if(KB[e.code]){e.preventDefault();if(!e.repeat){tap(KB[e.code]);tap('start')}}});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=false});
const dp=document.getElementById('dpad'),kn=document.getElementById('knob');let dpId=null;
function dpSet(e){const r=dp.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy),lim=r.width/2-27;if(m>lim){dx*=lim/m;dy*=lim/m}kn.style.transform=`translate(${dx}px,${dy}px)`;const t=13;keys.left=dx<-t;keys.right=dx>t;keys.up=dy<-t;keys.down=dy>t}
function dpClr(){dpId=null;kn.style.transform='';keys.left=keys.right=keys.up=keys.down=false}
dp.addEventListener('pointerdown',e=>{e.preventDefault();dpId=e.pointerId;try{dp.setPointerCapture(e.pointerId)}catch(_){}dpSet(e);initAudio()});
dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpSet(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dp.addEventListener(t,e=>{if(e.pointerId===dpId)dpClr()}));
document.querySelectorAll('#btns button').forEach(b=>{const k=b.dataset.b;
 b.addEventListener('pointerdown',e=>{e.preventDefault();tap(k);tap('start');b.classList.add('on')});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('on')))});
cv.addEventListener('pointerdown',()=>tap('start'));
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- stages (data, not hardcoded) ---------- */
/* Enemy letters: R raccoon, B winged rat, C dashing alley cat, P diving pigeon.
   Every stage's last wave is the boss. Story spine: Lazarus sells the cartridge
   at the Comic Crypt (stage 1), cuts through the neon subway (stage 2),
   and crosses the rooftops to reach the gig itself (stage 3). */
const STAGES=[
 {name:'THE GUTTER MILE',theme:0,len:2700,endName:'COMIC CRYPT',
  waves:[{at:420,q:['R','R']},{at:900,q:['R','B','R']},{at:1400,q:['R','B','R','B']},{at:1900,q:['B','R','R','B','R']},{at:2380,q:['BOSS']}],
  boss:{kind:'rackula',name:'COUNT RACKULA',hp:230,pts:2000,bar:'#9a1fd0',scale:2}},
 {name:'NEON SUBWAY',theme:1,len:2900,endName:'EXIT TO THE GIG',
  waves:[{at:420,q:['C','R','C']},{at:950,q:['P','R','P','C']},{at:1500,q:['R','C','B','P','R']},{at:2050,q:['C','C','P','B','R']},{at:2500,q:['BOSS']}],
  boss:{kind:'scratch',name:'SCRATCH, ALLEY QUEEN',hp:340,pts:2500,bar:'#ff4fa3',scale:2.1}},
 {name:'ROOFTOP DAWN — THE GIG',theme:2,len:3000,endName:'THE GIG',
  waves:[{at:420,q:['R','C','P','R']},{at:1000,q:['C','B','C','P','R']},{at:1600,q:['P','R','C','B','C','R']},{at:2200,q:['C','P','R','B','C','P']},{at:2620,q:['BOSS']}],
  boss:{kind:'baron',name:'BARON VON COON',hp:330,pts:3000,bar:'#e0302f',scale:2.6}}
];
const PTS={R:150,B:100,C:200,P:120};

/* ---------- state ---------- */
let state='title',stT=0,frame=0,camX=0,lockCam=null,shake=0,P,enemies,parts,pops,pickups,projs,waves,score,boss,goT,introT,deadT,stageIdx=0,stageStartScore=0,LEVEL_END=2700;
function setupStage(){
 const st=STAGES[stageIdx];LEVEL_END=st.len;
 waves=st.waves.map(w=>({at:w.at,q:w.q.slice(),active:false,done:false,n:0,st:0}));
 enemies=[];parts=[];pops=[];pickups=[];projs=[];boss=null;goT=0;introT=170;deadT=0;camX=0;lockCam=null;shake=0;
 P.x=70;P.y=205;P.z=0;P.vz=0;P.vx=0;P.atk=null;P.buf=null;P.down=0;P.hurt=0;P.inv=60;P.jumps=0;P.flip=0;P.bvx=0;
}
function reset(){
 P={x:70,y:205,z:0,vz:0,vx:0,face:1,hp:100,meter:0,inv:0,atk:null,combo:0,comboT:0,hurt:0,down:0,walk:0,lives:2,buf:null,dead:false,jumps:0,flip:0,bvx:0};
 score=0;stageIdx=0;stageStartScore=0;setupStage();
}
function restartStage(){ /* death restarts the CURRENT stage; score rolls back to what it was when the stage began */
 P.hp=100;P.lives=2;P.dead=false;P.down=0;P.hurt=0;P.inv=0;P.meter=0;P.atk=null;P.buf=null;P.combo=0;
 score=stageStartScore;setupStage();state='play';
}
function nextStage(){ /* score, lives and meter carry over; health refills by half */
 stageIdx++;stageStartScore=score;const healed=Math.min(100,P.hp+50);setupStage();P.hp=healed;
 pop(P.x,P.y,70,'STAGE CLEAR! +50 HP','#4fffb0');sfx('pick');
}
reset();

/* ---------- helpers ---------- */
function burst(x,y,z,n,c,sp=2){for(let i=0;i<n;i++)parts.push({x,y,z,vx:(Math.random()-.5)*sp*2,vz:Math.random()*sp*1.5+1,life:20+rnd(22),c,s:1+rnd(2)})}
function sparks(x,y,z,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1.5+Math.random()*2.5;parts.push({spark:1,x,y,z,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.5,vz:Math.random()*2,life:8+rnd(8),c:Math.random()<.5?'#fff27a':'#ffb020'})}}
function pop(x,y,z,s,c){pops.push({x,y,z,s,c,life:40})}
const HITW=['POW!','SMASH!','CRUNCH!','RIFF!','WHAM!','THUD!'];
function mkR(x,y){return{type:'R',x,y,z:0,vx:0,vz:0,hp:30,w:10,h:22,face:-1,st:'walk',t:0,cd:50+rnd(60),flash:0,anim:rnd(60),dead:false}}
function mkB(x,y){return{type:'B',x,y,z:70,vx:0,vz:0,hp:12,w:8,h:12,face:-1,st:'hover',t:0,cd:70+rnd(80),flash:0,anim:rnd(100),dead:false,off:(Math.random()<.5?-1:1)*70}}
function mkC(x,y){return{type:'C',x,y,z:0,vx:0,vz:0,hp:20,w:14,h:14,face:-1,st:'walk',t:0,cd:60+rnd(70),flash:0,anim:rnd(60),dead:false}}
function mkP(x,y){return{type:'P',x,y,z:80,vx:0,vz:0,hp:10,w:8,h:12,face:-1,st:'hover',t:0,cd:80+rnd(80),flash:0,anim:rnd(100),dead:false,off:(Math.random()<.5?-1:1)*56,tx:0,ty:0,sx:0,sy:0,sz:0}}
function mkBoss(x,y){const b=STAGES[stageIdx].boss;return{type:'boss',kind:b.kind,name:b.name,x,y,z:0,vx:0,vz:0,hp:b.hp,max:b.hp,pts:b.pts,bar:b.bar,scale:b.scale,w:20,h:46,face:-1,st:'walk',t:0,cd:110,flash:0,anim:0,dead:false,dashN:0}}
function touch(e,r){return Math.abs(P.x-e.x)<r&&Math.abs(P.y-e.y)<10&&P.z<e.z+e.h&&P.z+44>e.z&&P.inv<=0&&P.down<=0}

function hurtPlayer(d,dir,kd){
 if(P.inv>0||P.down>0||state!=='play')return;
 P.hp-=d;P.inv=55;P.atk=null;P.buf=null;shake=Math.max(shake,6);sfx('hurt');burst(P.x,P.y,30,5,'#d12a2a');
 if(kd||P.z>0){P.down=42;P.vx=dir*3;P.vz=3;P.z=Math.max(P.z,1)}else{P.hurt=14;P.vx=dir*2}
 if(P.hp<=0){P.hp=0;
  if(P.lives>0){P.lives--;P.hp=100;P.down=55;P.inv=140;P.meter=100;pop(P.x,P.y,60,'GET UP, LAZ!','#ffd34f')}
  else{P.dead=true;P.down=99999;deadT=100}}
}
function hurtEnemy(e,d,dir,kd){
 e.hp-=d;e.flash=8;sfx('hit');burst(e.x,e.y,e.z+e.h/2,4,'#7a0f2a');sparks(e.x,e.y,e.z+e.h/2,5);
 if(Math.random()<.45)pop(e.x,e.y,e.z+e.h+6,HITW[rnd(HITW.length)],'#fff27a');
 if(e.type==='boss'){if(e.st!=='charge'&&e.st!=='dash')e.x+=dir*(kd?6:2);if(kd)shake=Math.max(shake,5)}
 else{e.st='hurt';e.t=kd?32:12;e.vx=dir*(kd?3.6:1.4);if(e.type==='R'&&kd)e.vz=3;if(e.type==='P'){e.z=Math.max(5,e.z-4)}}
 if(e.hp<=0){e.dead=true;e.vx=dir*3;e.vz=4;e.t=e.type==='boss'?90:50;sfx('kill');
  score+=e.type==='boss'?e.pts:PTS[e.type];
  burst(e.x,e.y,e.z+10,e.type==='boss'?40:12,e.type==='boss'?'#9a1fd0':'#7a0f2a',e.type==='boss'?4:2.5);
  if(e.type==='boss'){shake=20;pop(e.x,e.y,90,e.name+' IS DUST','#e8b0ff');if(boss===e)boss=null;pickups.push({kind:'potion',x:e.x,y:e.y,t:700})}
  else{if(Math.random()<(e.type==='R'?.2:e.type==='C'?.25:.1))pickups.push({kind:'pizza',x:e.x,y:e.y,t:700});
   if(Math.random()<.12)pickups.push({kind:'potion',x:e.x,y:e.y,t:700})}}
}
function doHits(a){
 for(const e of enemies){if(e.dead||a.hit.has(e))continue;
  const dx=(e.x-P.x)*P.face;if(dx<2||dx>a.reach+e.w)continue;
  if(Math.abs(e.y-P.y)>14)continue;
  if(e.z+e.h<P.z-5||e.z>P.z+40)continue;
  a.hit.add(e);hurtEnemy(e,a.dmg,P.face,a.kd);P.meter=Math.min(100,P.meter+7);score+=10}
}
function doSpecial(){
 sfx('rock');shake=14;parts.push({ring:1,x:P.x,y:P.y,r:6,life:34});
 for(let i=0;i<10;i++)parts.push({note:1,x:P.x,y:P.y,z:30,vx:Math.cos(i/10*6.28)*2.2,vz:1.5+Math.random()*2,life:45,c:['#ffd34f','#ff4fa3','#4fffb0'][i%3]});
 pop(P.x,P.y,70,'POWER CHORD!','#ffd34f');
 for(const e of enemies){if(e.dead)continue;if(Math.abs(e.x-P.x)<110&&Math.abs(e.y-P.y)<45)hurtEnemy(e,e.type==='boss'?30:40,e.x>=P.x?1:-1,true)}
}

/* ---------- player ---------- */
function autoFace(range,depth){ /* turn toward the closest living enemy inside the window; flying enemies count by their ground position (e.x/e.y). Returns the enemy faced, or null (facing unchanged) */
 let best=null,bd=Infinity;for(const e of enemies){if(e.dead)continue;const dx=Math.abs(e.x-P.x);if(dx>range||Math.abs(e.y-P.y)>depth)continue;if(dx<bd){bd=dx;best=e}}
 if(best)P.face=best.x>=P.x?1:-1;return best}
function startAtk(type){
 autoFace(170,50); /* every attack starts facing the closest enemy in range */
 if(type==='p'){P.combo=P.comboT>0?(P.combo+1)%3:0;const fin=P.combo===2;P.atk={type:'p',t:0,dur:fin?17:12,a0:3,a1:7,dmg:fin?14:7,reach:24,kd:fin,hit:new Set()}}
 else P.atk={type:'k',t:0,dur:20,a0:6,a1:12,dmg:13,reach:30,kd:true,hit:new Set()};
}
function updPlayer(){
 if(P.z>0||P.vz>0){P.z+=P.vz;P.vz-=.42;if(P.z<=0){P.z=0;P.vz=0;P.jumps=0;P.flip=0;P.bvx=0;burst(P.x,P.y,2,4,'#8a8378',1);if(P.atk&&P.atk.type==='jk')P.atk=null}}
 if(P.flip>0)P.flip--;
 if(P.z>0&&P.bvx){P.x+=P.bvx;P.bvx*=.9;if(Math.abs(P.bvx)<.2)P.bvx=0}
 if(P.inv>0)P.inv--;
 if(P.down>0){P.down--;P.x+=P.vx;P.vx*=.9;bound();return}
 if(P.hurt>0){P.hurt--;P.x+=P.vx;P.vx*=.85}
 const ground=P.z<=0;let mx=(keys.right?1:0)-(keys.left?1:0),my=(keys.down?1:0)-(keys.up?1:0);
 const busy=P.atk&&ground;
 if(!busy&&P.hurt<=0){P.x+=mx*1.9;if(ground)P.y+=my*1.25;if(mx)P.face=mx;if((mx||my)&&ground)P.walk++;else P.walk=0}
 if(!mx&&!my&&!P.atk&&P.down<=0)autoFace(70,50); /* soft auto-face: only while no direction is held and not mid-attack, so it never fights the player's steering */
 if(P.hurt<=0){
  if(press.jump&&ground&&!P.atk){P.vz=6.3;P.jumps=1;sfx('jump')}
  else if(press.jump&&!ground&&P.jumps===1){P.vz=5.6;P.jumps=2;P.flip=18;P.bvx=P.face*4.2;sfx('jump');burst(P.x,P.y,P.z,4,'#cfd4da',1)} /* double jump: the flip — renewed lift plus a forward boost in the facing direction, one per airborne period */
  if(!ground){if((press.punch||press.kick)&&!P.atk){autoFace(170,50);P.atk={type:'jk',t:0,dmg:18,reach:30,kd:true,hit:new Set()}}}
  else if(press.special&&P.meter>=100&&(!P.atk||P.atk.type!=='sp')){P.meter=0;P.atk={type:'sp',t:0,dur:36,hit:new Set()};doSpecial()}
  else if(!P.atk){if(press.punch)startAtk('p');else if(press.kick)startAtk('k')}
  else if(P.atk.type==='p'||P.atk.type==='k'){if(press.punch)P.buf='p';else if(press.kick)P.buf='k'}
 }
 if(P.comboT>0)P.comboT--;
 if(P.atk){const a=P.atk;a.t++;
  const active=a.type==='jk'||(a.type!=='sp'&&a.t>=a.a0&&a.t<=a.a1);if(active)doHits(a);
  if(a.type!=='jk'&&a.t>=a.dur){if(a.type==='p')P.comboT=20;P.atk=null;if(P.buf){const b=P.buf;P.buf=null;startAtk(b)}}}
 bound();
 for(const k of pickups){if(Math.abs(k.x-P.x)<14&&Math.abs(k.y-P.y)<10&&P.z<10){k.t=0;sfx('pick');
  if(k.kind==='potion'){P.hp=Math.min(100,P.hp+40);pop(P.x,P.y,56,'POTION +40','#ff5a5a')}
  else{P.hp=Math.min(100,P.hp+30);score+=50;pop(P.x,P.y,56,'PIZZA!','#ffb020')}}}
 for(const s of projs){ /* boss ground shockwaves: jump over them or get hit */
  if(Math.abs(s.x-P.x)<12&&Math.abs(s.y-P.y)<10&&P.z<12)hurtPlayer(12,s.vx>0?1:-1,false)}
}
function bound(){P.y=clamp(P.y,GY0,GY1);P.x=clamp(P.x,camX+12,camX+W-12)}

/* ---------- enemies ---------- */
function phys(e){if(e.z>0||e.vz>0){e.z+=e.vz;e.vz-=.35;if(e.z<0){e.z=0;e.vz=0}}}
function updEnemy(e){
 e.anim++;if(e.flash>0)e.flash--;
 if(e.dead){e.x+=e.vx;e.vx*=.94;if(e.type==='B'||e.type==='P')e.z=Math.max(0,e.z-2.5);else phys(e);e.t--;return}
 const dx=P.x-e.x,dy=P.y-e.y,adx=Math.abs(dx);
 if(e.type==='R'){switch(e.st){
  case 'hurt':e.x+=e.vx;e.vx*=.86;phys(e);if(--e.t<=0&&e.z===0){e.st='walk';e.cd=Math.max(e.cd,25)}break;
  case 'walk':{e.face=dx>=0?1:-1;const tx=P.x-e.face*28,ex=tx-e.x,ey=P.y-e.y;
   e.x+=clamp(ex,-1.1,1.1);e.y+=clamp(ey,-.75,.75);

function updWaves(){
 for(const w of waves){if(w.done)continue;
  if(!w.active){if(P.x>w.at-40){w.active=true;lockCam=clamp(w.at-W/2,camX,LEVEL_END-W)}break}
  if(w.q.length&&(w.st++%45===0))spawn(w.q.shift(),w);
  /* alive is counted AFTER this tick's spawn: counting before it (the v1 code
     did) marked a wave done the very tick its last enemy — or its boss — spawned */
  if(!w.q.length&&enemies.every(e=>e.dead)){w.done=true;lockCam=null;goT=150}
  break}

  if(stageIdx<STAGES.length-1)nextStage();
  else{state='win';stT=0;sfx('pick')}}
}

function tick(){
 frame++;
 if(state==='play'){
  updPlayer();for(const e of enemies)updEnemy(e);
  for(const s of projs){s.x+=s.vx;s.t--}projs=projs.filter(s=>s.t>0);
  for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){const a=enemies[i],b=enemies[j];
   if(a.dead||b.dead||a.type==='B'||a.type==='P'||b.type==='B'||b.type==='P')continue;if(Math.abs(b.x-a.x)<14&&Math.abs(b.y-a.y)<8){const s=b.y>=a.y?1:-1;a.y-=s*.5;b.y+=s*.5}}
  enemies=enemies.filter(e=>!(e.dead&&e.t<=0));
  updWaves();updCam();
  if(goT>0)goT--;if(introT>0)introT--;
  if(P.dead&&--deadT<=0){state='over';stT=0}
 }else{stT++;if(press.start&&stT>40){if(state==='over')restartStage();else{reset();state='play'}}}
 for(const p of parts){p.life--;if(p.ring){p.r+=4;continue}if(p.ghost)continue;if(p.spark){p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.vz-=.3;continue}p.x+=p.vx;p.z+=p.vz;p.vz-=p.note?.05:.2;if(p.z<0){p.z=0;p.vx*=.5;p.vz=0}}
 parts=parts.filter(p=>p.life>0);
 for(const p of pops){p.life--;p.z+=.6}pops=pops.filter(p=>p.life>0);
 for(const k of pickups)k.t--;pickups=pickups.filter(k=>k.t>0);
 if(shake>0)shake--;
 for(const k in press)press[k]=false;
}

function hud(){
 const st=STAGES[stageIdx];
 R(4,4,126,36,'rgba(0,0,0,.55)');txt('LAZARUS',8,8,7,'#ffd34f');txt('x'+P.lives,104,8,7,'#fff');
 R(8,18,104,7,'#300');R(8,18,P.hp*1.04,7,P.hp>30||frame%10<5?'#e0302f':'#ff8080');R(8,18,104,1,'rgba(255,255,255,.25)');
 txt('ROCK',8,30,6,'#bbb');R(40,30,72,5,'#222');R(40,30,P.meter*.72,5,P.meter>=100?(frame%8<4?'#fff27a':'#ffb020'):'#d08a10');
 txt(String(score).padStart(6,'0'),W-8,8,8,'#fff','right');
 txt('STAGE '+(stageIdx+1)+' / '+STAGES.length,W-8,22,6,'#7fd0ff','right');
 txt(st.name,W-8,32,5,'#ddd','right');
 if(P.meter>=100&&frame%40<28)txt('ROCK READY',W-8,44,6,'#ffd34f','right');
 if(boss&&!boss.dead&&boss.x-camX<W){txt(boss.name,W/2,H-30,7,'#e8b0ff','center');R(90,H-18,300,8,'#200');R(90,H-18,300*Math.max(0,boss.hp)/boss.max,8,boss.bar)}
 if(goT>0&&frame%30<20)txt('GO >>',W-12,112,12,'#ffd34f','right');
 if(introT>0&&introT<160){ctx.save();ctx.globalAlpha=Math.min(1,introT/30);txt('STAGE '+(stageIdx+1),W/2,92,9,'#ff6ac8','center');txt(st.name,W/2,108,12,'#fff','center');txt('GET TO: '+st.endName,W/2,128,6,'#ffd34f','center');ctx.restore()}
}
function overlay(a){R(0,0,W,H,`rgba(5,2,12,${a})`)}
function draw(){
 const keep=camX;camX=Math.round(camX);
 ctx.save();if(shake>0)ctx.translate(rnd(5)-2,rnd(5)-2);
 drawBG();
 const list=[...pickups.map(k=>({y:k.y-.1,d:()=>k.kind==='potion'?drawPotion(k):drawPizza(k)})),...projs.map(s=>({y:s.y+.2,d:()=>drawShock(s)})),...enemies.map(e=>({y:e.y,d:()=>drawEnt(e)}))];
 if(state!=='win')list.push({y:P.y,d:drawLaz});
 list.sort((a,b)=>a.y-b.y).forEach(o=>o.d());
 drawFX();ctx.restore();
 if(state==='play')hud();
 else if(state==='title'){overlay(.6);
  txt('HOMELESS',W/2,26,24,'#e0302f','center','#300');txt('ROCK STAR',W/2,58,24,'#ffd34f','center','#420');
  txt('LAZARUS VS. THE NIGHT VERMIN',W/2,94,7,'#e8b0ff','center');
  ['HE HAS ONE THING LEFT:','A MINT VAN HELSING CARTRIDGE.','THE COMIC SHOP PAYS CASH.','THE RACCOONS DRINK BLOOD.','THE RATS GREW WINGS.','THREE STAGES TO THE GIG.'].forEach((s,i)=>txt(s,W/2,116+i*13,7,'#ddd','center'));
  if(frame%50<34)txt('TAP OR PRESS ENTER',W/2,208,8,'#fff','center');
  txt('JUMP TWICE TO FLIP OVER BOSSES',W/2,224,6,'#7fd0ff','center');
  txt('FILL THE ROCK BAR, THEN HIT ROCK',W/2,236,6,'#ffb020','center')}
 else if(state==='over'){overlay(.7);txt('GAME OVER',W/2,80,22,'#e0302f','center');txt('THE VERMIN GOT THE CARTRIDGE',W/2,124,7,'#ddd','center');txt('SCORE '+score,W/2,148,8,'#ffd34f','center');if(stT>40&&frame%50<34)txt('TAP TO TRY THE STAGE AGAIN',W/2,190,8,'#fff','center')}
 else if(state==='win'){overlay(.62);txt('SOLD!',W/2,44,28,'#4fffb0','center');
  ['COMIC CRYPT PAID $40','FOR VAN HELSING.','LAZARUS EATS TONIGHT.','HE MADE THE GIG.'].forEach((s,i)=>txt(s,W/2,96+i*16,8,'#fff','center'));
  txt('FINAL SCORE '+score,W/2,172,9,'#ffd34f','center');if(stT>40&&frame%50<34)txt('TAP TO PLAY AGAIN',W/2,212,8,'#fff','center')}
 camX=keep;
}

/* ---------- loop ---------- */
let last=0,acc=0;
function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;acc+=Math.min(100,ts-last);last=ts;while(acc>=1000/60){tick();acc-=1000/60}draw()}
if(document.fonts&&document.fonts.load)document.fonts.load(`10px ${F}`).catch(()=>{});
requestAnimationFrame(loop);

/* debug/testing hook: inert in play, lets a headless harness drive the game */
window.__HRS={get state(){return state},get stageIdx(){return stageIdx},get stage(){return STAGES[stageIdx]},get P(){return P},
 get enemies(){return enemies},get boss(){return boss},get score(){return score},get waves(){return waves},get projs(){return projs},
 get pickups(){return pickups},get camX(){return camX},
 stages:STAGES,hurtEnemy,tick,pressObj:press,keysObj:keys,mkR,mkB,mkC,mkP,mkBoss,autoFace,
 gotoStage(i){stageIdx=i;stageStartScore=score;setupStage();state='play'},
 setCam(x){camX=x;lockCam=x},
 start(){reset();state='play'},forceStart(){press.start=true}};
})();
</script>
